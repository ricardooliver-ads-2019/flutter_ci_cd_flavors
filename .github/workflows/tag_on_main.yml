name: tag_on_main

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: tag_on_main
  cancel-in-progress: false

jobs:
  tag:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide bump type from PR labels
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          echo "PR labels: $LABELS"

          HAS_MAJOR=0
          HAS_MINOR=0
          HAS_PATCH=0

          echo "$LABELS" | grep -q "semver:major" && HAS_MAJOR=1 || true
          echo "$LABELS" | grep -q "semver:minor" && HAS_MINOR=1 || true
          echo "$LABELS" | grep -q "semver:patch" && HAS_PATCH=1 || true

          COUNT=$((HAS_MAJOR + HAS_MINOR + HAS_PATCH))

          if [ "$COUNT" -eq 0 ]; then
            echo " Missing semver label. Add one of: semver:patch | semver:minor | semver:major"
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo " More than one semver label found. Keep only ONE."
            exit 1
          fi

          if [ "$HAS_MAJOR" -eq 1 ]; then
            BUMP="major"
          elif [ "$HAS_MINOR" -eq 1 ]; then
            BUMP="minor"
          else
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo " Bump type: $BUMP"

      - name: Create next tag (semver)
        id: next
        run: |
          git fetch --tags
          LAST=$(git tag --list "v*" --sort=-v:refname | head -n 1)

          if [ -z "$LAST" ]; then
            MA=0; MI=1; PA=0
          else
            VER=${LAST#v}
            IFS='.' read -r MA MI PA <<< "$VER"
          fi

          BUMP="${{ steps.bump.outputs.bump }}"

          if [ "$BUMP" = "major" ]; then
            MA=$((MA+1)); MI=0; PA=0
          elif [ "$BUMP" = "minor" ]; then
            MI=$((MI+1)); PA=0
          else
            PA=$((PA+1))
          fi

          NEXT="v$MA.$MI.$PA"
          echo "next_tag=$NEXT" >> $GITHUB_OUTPUT
          echo " Next tag: $NEXT"

      - name: Push tag (skip if already exists)
        run: |
          TAG="${{ steps.next.outputs.next_tag }}"

          git fetch --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo " Tag $TAG already exists. Skipping."
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"
