name: deploy_hml

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  android_hml:
    if: |
      github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    name: Deploy Android to Homologation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          mkdir -p android/app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=keystore/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOF

      - name: Setup Ruby + Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: android

      - name: Distribute to Firebase App Distribution (HML)
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID_ANDROID_HML: ${{ secrets.FIREBASE_APP_ID_ANDROID_HML }}
        run: bundle exec fastlane android beta

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR with bumped pubspec (if changed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="ci/bump-build-${GITHUB_RUN_ID}-${GITHUB_SHA::7}"
          git checkout -b "$BRANCH"

          # Se não teve mudança, não faz nada
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add pubspec.yaml
          git commit -m "chore(beta): bump buildNumber [skip ci]"
          git push origin "$BRANCH"

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(beta): bump buildNumber" \
            --body "PR gerado automaticamente após deploy HML para registrar o incremento de buildNumber no pubspec.yaml."

          echo "PR created successfully."
