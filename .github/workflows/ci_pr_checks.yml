name: ci_pr_checks

on:
  pull_request:
    branches: [main, develop]


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Install dependencies
        run: flutter pub get

      - name: Dart format (check)
        run: dart format --set-exit-if-changed .

      - name: Flutter analyze
        run: flutter analyze
        
      - name: Flutter test
        run: flutter test